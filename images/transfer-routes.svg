<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 656" width="1200" height="656" role="img" aria-label="역별 휠체어 환승 동선 비교: 동래역, 서면역 B, 연산역 B는 직행 엘리베이터가 없어 우회 단계가 많고, 수영역은 직행 엘리베이터로 바로 연결됨">
<style>
  /* ================= 색상 설정 (이 부분만 바꾸면 됩니다) ================= */
  :root {
    --bg:       #FFFFFF;  /* 배경 */
    --border:   #E5E7EB;  /* 테두리 */
    --axis:     #CBD2DC;  /* 동선 선 */
    --text:     #111827;  /* 글자 */
    --muted:    #6B7280;  /* 보조 글자 */
    --endpoint: #9CA3AF;  /* 출발 · 도착 승강장 */
    --accent-1: #2563EB;  /* 파랑: 직행 엘리베이터 */
    --accent-2: #F97316;  /* 주황: 이동을 어렵게 만드는 구간 */
  }
  /* ===================================================================== */
  .bg { fill: var(--bg); } .border { fill: none; stroke: var(--border); }
  .axis { stroke: var(--axis); } .t { fill: var(--text); } .m { fill: var(--muted); }
  .sm { stroke: var(--muted); } .endc { fill: var(--endpoint); }
  .a1 { fill: var(--accent-1); } .a2 { fill: var(--accent-2); }
  text { font-family: Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; }
</style>
<rect class="bg" width="1200" height="656" rx="18"/><rect class="border" x="0.5" y="0.5" width="1199" height="655" rx="18"/>
<text class="t" x="44" y="46" font-size="17" font-weight="700">휠체어 환승 동선 비교 (도식)</text>
<g font-size="14">
  <circle class="endc" cx="730" cy="41" r="7"/><text class="m" x="744" y="46">승강장</text>
  <circle class="bg sm" cx="820" cy="41" r="7" stroke-width="2.5"/><text class="m" x="834" y="46">일반 이동</text>
  <circle class="a2" cx="924" cy="41" r="8"/><text class="m" x="938" y="46">이동을 어렵게 만든 구간</text>
  <circle class="a1" cx="1100" cy="41" r="8"/><text class="m" x="1114" y="46">직행</text>
</g>
<text class="t" x="44" y="122" font-size="21" font-weight="800">동래역</text><text class="a2" x="44" y="146" font-size="14" font-weight="700">직행 엘리베이터 없음</text><line class="axis" x1="250" y1="120" x2="910" y2="120" stroke-width="3"/><circle class="endc" cx="250" cy="120" r="9"/><text class="t" x="250" y="156" text-anchor="middle" font-size="15" font-weight="600">이전 승강장</text><circle class="bg sm" cx="415" cy="120" r="10" stroke-width="3"/><text class="t" x="415" y="156" text-anchor="middle" font-size="15" font-weight="600">개찰구 밖으로</text><circle class="a2" cx="580" cy="120" r="13"/><text x="580" y="125" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">!</text><text class="t" x="580" y="156" text-anchor="middle" font-size="15" font-weight="600">역 밖 보도 횡단</text><circle class="a2" cx="745" cy="120" r="13"/><text x="745" y="125" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">!</text><text class="t" x="745" y="156" text-anchor="middle" font-size="15" font-weight="600">반대편 출입구로</text><text class="m" x="745" y="175" text-anchor="middle" font-size="13" font-weight="400">다시 진입</text><circle class="endc" cx="910" cy="120" r="9"/><text class="t" x="910" y="156" text-anchor="middle" font-size="15" font-weight="600">환승 승강장</text><text class="t" x="44" y="262" font-size="21" font-weight="800">서면역 B</text><text class="a2" x="44" y="286" font-size="14" font-weight="700">직행 엘리베이터 없음</text><line class="axis" x1="250" y1="260" x2="745" y2="260" stroke-width="3"/><circle class="endc" cx="250" cy="260" r="9"/><text class="t" x="250" y="296" text-anchor="middle" font-size="15" font-weight="600">이전 승강장</text><circle class="a2" cx="415" cy="260" r="13"/><text x="415" y="265" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">!</text><text class="t" x="415" y="296" text-anchor="middle" font-size="15" font-weight="600">휠체어 리프트</text><text class="m" x="415" y="315" text-anchor="middle" font-size="13" font-weight="400">혼자 수동 조작</text><circle class="bg sm" cx="580" cy="260" r="10" stroke-width="3"/><text class="t" x="580" y="296" text-anchor="middle" font-size="15" font-weight="600">엘리베이터</text><circle class="endc" cx="745" cy="260" r="9"/><text class="t" x="745" y="296" text-anchor="middle" font-size="15" font-weight="600">환승 승강장</text><text class="t" x="44" y="402" font-size="21" font-weight="800">연산역 B</text><text class="a2" x="44" y="426" font-size="14" font-weight="700">직행 엘리베이터 없음</text><line class="axis" x1="250" y1="400" x2="910" y2="400" stroke-width="3"/><circle class="endc" cx="250" cy="400" r="9"/><text class="t" x="250" y="436" text-anchor="middle" font-size="15" font-weight="600">이전 승강장</text><circle class="bg sm" cx="415" cy="400" r="10" stroke-width="3"/><text class="t" x="415" y="436" text-anchor="middle" font-size="15" font-weight="600">대합실로 이동</text><circle class="a2" cx="580" cy="400" r="13"/><text x="580" y="405" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">!</text><text class="t" x="580" y="436" text-anchor="middle" font-size="15" font-weight="600">개찰구 통과 (1)</text><circle class="a2" cx="745" cy="400" r="13"/><text x="745" y="405" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">!</text><text class="t" x="745" y="436" text-anchor="middle" font-size="15" font-weight="600">개찰구 통과 (2)</text><circle class="endc" cx="910" cy="400" r="9"/><text class="t" x="910" y="436" text-anchor="middle" font-size="15" font-weight="600">환승 승강장</text><text class="a2" x="44" y="450" font-size="13" font-weight="600">※ 안내된 직원 호출</text><text class="a2" x="44" y="467" font-size="13" font-weight="600">   버튼이 실제로 없음</text><line class="axis" x1="40" y1="484" x2="1160" y2="484" stroke-width="1" stroke-dasharray="4 5"/><text class="t" x="44" y="542" font-size="21" font-weight="800">수영역</text><text class="a1" x="44" y="566" font-size="14" font-weight="700">직행 엘리베이터 있음</text><line class="axis" x1="250" y1="540" x2="580" y2="540" stroke-width="3"/><circle class="endc" cx="250" cy="540" r="9"/><text class="t" x="250" y="576" text-anchor="middle" font-size="15" font-weight="600">이전 승강장</text><circle class="a1" cx="415" cy="540" r="13"/><path d="M410 540 l3.5 4 l6.5 -8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text class="t" x="415" y="576" text-anchor="middle" font-size="15" font-weight="600">직행 엘리베이터</text><circle class="endc" cx="580" cy="540" r="9"/><text class="t" x="580" y="576" text-anchor="middle" font-size="15" font-weight="600">환승 승강장</text>
</svg>